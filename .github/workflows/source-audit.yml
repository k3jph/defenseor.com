name: Publication source audit
on:
  push:
    branches: [build/initial-site]
    paths: [.github/workflows/source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Read first-edition published metadata
        run: |
          mkdir -p artifacts/source-audit
          curl --fail --retry 3 'https://api.crossref.org/works?filter=isbn:9780429467219&rows=100' -o artifacts/source-audit/crossref-chapters-1e.json
          curl --fail --retry 3 'https://registry.npmjs.org/@axe-core/playwright/4.11.1' -o artifacts/source-audit/axe-package.json
      - name: Install pinned review tools without changing the repository
        run: |
          npm install --save-dev --save-exact @axe-core/playwright@4.11.1
          cp package.json package-lock.json artifacts/source-audit/
          tar -czf artifacts/source-audit/review-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: publication-source-audit
          path: artifacts/source-audit/
          retention-days: 7
