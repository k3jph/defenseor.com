name: Publish an approved release
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed commit SHA, already on main
        required: true
        type: string
      confirmation:
        description: Type PUBLISH defenseor.com after both editor reviews
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      APPROVED_SHA: ${{ vars.APPROVED_RELEASE_SHA }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PUBLIC_GA_ID: ''
      PREVIEW_BUILD: 'false'
    steps:
      - name: Require explicit reviewed-release approval
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRMATION" = 'PUBLISH defenseor.com'
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$APPROVED_SHA"
          test "$RELEASE_SHA" = "$APPROVED_SHA"
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require release ancestry on main
        run: |
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          git checkout --detach "$RELEASE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:links
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:consent
      - name: Record exact output manifest for rollback
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/output-sha256.txt
          printf '%s\n' "$RELEASE_SHA" > artifacts/release-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: approved-release-${{ inputs.release_sha }}
          path: |
            dist/
            artifacts/output-sha256.txt
            artifacts/release-sha.txt
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Real-domain acceptance
        run: node scripts/check-launch.mjs --live
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance
          path: artifacts/launch-results.json
