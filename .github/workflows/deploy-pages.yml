name: Publish production site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.sha }}
      PUBLIC_GA_ID: ''
      PREVIEW_BUILD: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:links
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:consent
      - name: Record exact output manifest for rollback
        run: |
          mkdir -p artifacts
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/output-sha256.txt
          printf '%s\n' "$RELEASE_SHA" > artifacts/release-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: |
            dist/
            artifacts/output-sha256.txt
            artifacts/release-sha.txt
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Real-domain acceptance
        run: node scripts/check-launch.mjs --live
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance
          path: artifacts/launch-results.json
