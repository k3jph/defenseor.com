name: Diagnose the published Pages origin
on:
  push:
    branches: [ops/launch-2026-09-24]
    paths: [.github/workflows/origin-check.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the documented Pages origin without changing DNS or TLS policy
        run: |
          mkdir -p artifacts
          dig +noall +answer k3jph.github.io A > artifacts/github-origin-dns.txt
          curl --silent --show-error --max-time 20 --dump-header artifacts/origin-http.headers --header 'Host: defenseor.com' http://185.199.108.153/ -o artifacts/origin-http.html
          set +e
          curl --silent --show-error --max-time 20 --dump-header artifacts/origin-https.headers --resolve defenseor.com:443:185.199.108.153 https://defenseor.com/ -o artifacts/origin-https.html 2> artifacts/origin-https-error.txt
          tls_result=$?
          echo "$tls_result" > artifacts/origin-https-exit-code.txt
          set -e
          python3 - <<'PY'
          import pathlib, json, hashlib, datetime
          p=pathlib.Path('artifacts')
          home=(p/'origin-http.html').read_text()
          r={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Direct documented GitHub Pages origin observation; NOT public-domain acceptance','origin':'185.199.108.153','host':'defenseor.com','http_headers':(p/'origin-http.headers').read_text(),'http_body_sha256':hashlib.sha256(home.encode()).hexdigest(),'contains_companion':all(x in home for x in ['A website of','Natalie Scala','/chapters/']),'contains_holding_page':'COMING SOON' in home,'tls_curl_exit_code':int((p/'origin-https-exit-code.txt').read_text()),'tls_error':(p/'origin-https-error.txt').read_text()}
          (p/'origin-diagnostic.json').write_text(json.dumps(r,indent=2));print(json.dumps(r,indent=2))
          assert r['contains_companion'] and not r['contains_holding_page'], 'Origin did not return the expected companion.'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: origin-diagnostic
          path: artifacts/
          retention-days: 90
