name: Verify companion site
on:
  push:
    branches: [main, build/initial-site]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_GA_ID: ''
      PREVIEW_BUILD: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:links
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:consent
      - name: Build the non-indexable review version
        run: npx astro build --outDir artifacts/preview
        env:
          PREVIEW_BUILD: 'true'
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-review
          path: |
            artifacts/*.json
            artifacts/*.png
            artifacts/*.pdf
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: static-review-preview
          path: artifacts/preview/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          retention-days: 30
