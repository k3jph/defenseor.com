name: Import and verify initial companion
on:
  push:
    branches: [build/initial-site]
    paths: [.github/workflows/import.yml, .bootstrap/**]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/initial-site
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate source transfer before extracting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          pieces=[Path(f'.bootstrap/source.{i}').read_bytes() for i in range(4)]
          b=base64.b64encode(pieces[2]).decode()
          pieces[2]=base64.b64decode(b[:3120]+'H'+b[3120:10198]+'D')
          b=base64.b64encode(pieces[3]).decode()
          pieces[3]=base64.b64decode(b[:10114]+b[10158:])
          source=b''.join(pieces)
          assert hashlib.sha256(source).hexdigest() == '3ce184ed9b16000e78f69364f9b78eb38783ef007aa4e6a3aa579e292341d6ac'
          Path('/tmp/source.tar.gz').write_bytes(source)
          print('Source archive matches the authored local files exactly.')
          PY
          tar -xzf /tmp/source.tar.gz
      - name: Persist source to build branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs src public scripts tests astro.config.mjs package.json .gitignore
          git diff --cached --quiet || git commit -m 'Implement editorial MDOR companion with edition-aware records and joint identity'
          git push origin HEAD:build/initial-site
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-review
          path: |
            .bootstrap/
            artifacts/
            dist/
          include-hidden-files: true
          retention-days: 7
