name: Request authorized first release
on:
  push:
    branches: [ops/launch-2026-09-24]
    paths: [.github/workflows/release-request.yml]
permissions:
  contents: read
  pages: read
  actions: write
jobs:
  request:
    if: github.actor == 'howardjp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: k3jph/defenseor.com
      RELEASE_SHA: 32a4ab90e18fa1a5bcd1cb03c28c27e59f22b2c0
      EXISTING_APPROVAL: ${{ vars.APPROVED_RELEASE_SHA }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact approved source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = '516b29d65a6be4e1704ffaaf21e06a7c4ed9d2ce'
          mkdir -p artifacts
      - name: Read hosting configuration and preserve pre-cutover public responses
        run: |
          gh api "repos/$GH_REPO/pages" > artifacts/pages-before.json
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.error, subprocess, datetime
          p=pathlib.Path('artifacts')
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'responses':[],'dns':[]}
          for host in ['defenseor.com','www.defenseor.com']:
              for typ in ['NS','A','AAAA','CNAME','CAA','MX','TXT']:
                  r=subprocess.run(['dig','+noall','+answer',host,typ],capture_output=True,text=True,timeout=20)
                  report['dns'].append({'host':host,'type':typ,'answer':r.stdout.strip()})
              for scheme in ['http','https']:
                  url=f'{scheme}://{host}/'
                  try:
                      try: response=urllib.request.urlopen(url,timeout=30)
                      except urllib.error.HTTPError as e: response=e
                      body=response.read()
                      name=f'{scheme}-{host}.html'
                      (p/name).write_bytes(body)
                      report['responses'].append({'url':url,'status':response.status,'final_url':response.geturl(),'headers':dict(response.headers),'body_file':name})
                  except Exception as e: report['responses'].append({'url':url,'error':str(e)})
          (p/'preflight.json').write_text(json.dumps(report,indent=2))
          pages=json.loads((p/'pages-before.json').read_text())
          print(json.dumps({'pages':pages,'preflight':report},indent=2))
          assert pages.get('cname')=='defenseor.com', 'Custom domain is not defenseor.com; stop without changing it.'
          assert pages.get('build_type')=='workflow', 'Pages is not configured for Actions; stop without changing settings.'
          PY
      - name: Require passing verification on the merged commit
        run: |
          for attempt in $(seq 1 30); do
            gh api "repos/$GH_REPO/actions/runs?head_sha=$RELEASE_SHA&event=push" > artifacts/merged-verification.json
            result=$(jq -r '[.workflow_runs[] | select(.path == ".github/workflows/build.yml")][0] | if .status == "completed" then .conclusion else "pending" end' artifacts/merged-verification.json)
            if [ "$result" = success ]; then break; fi
            if [ "$result" != pending ]; then echo "Verification did not pass: $result"; exit 1; fi
            sleep 10
          done
          test "$result" = success
      - name: Record exact release approval through the normal repository-variable API
        run: |
          if [ "$EXISTING_APPROVAL" != "$RELEASE_SHA" ]; then
            gh variable set APPROVED_RELEASE_SHA --repo "$GH_REPO" --body "$RELEASE_SHA"
          fi
      - name: Dispatch the existing gated publication workflow from main
        run: |
          gh workflow run deploy-pages.yml --repo "$GH_REPO" --ref main -f release_sha="$RELEASE_SHA" -f confirmation='PUBLISH defenseor.com'
          printf '%s\n' "$RELEASE_SHA" > artifacts/dispatched-release.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-release-preflight
          path: artifacts/
          retention-days: 90
